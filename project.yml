name: TaskManager

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Info.plist はファイルで持たず、ビルド設定から生成する
    GENERATE_INFOPLIST_FILE: YES

packages:
  TaskManagerKit:
    path: Packages/TaskManagerKit

targets:
  TaskManager:
    type: application
    platform: iOS
    sources: [TaskManager]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # SwiftLint がソースを読めるよう、ビルドスクリプトのサンドボックスを無効化する
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: TaskManagerKit
        products: [Domain, Persistence, Notifications, HomeFeature, TaskListFeature, SettingsFeature, UsageTimeFeature]
    postBuildScripts:
      - name: SwiftLint
        # Xcode から実行すると Homebrew のパスが通っていないため追加する
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if command -v swiftlint >/dev/null; then
            cd "$SRCROOT" && swiftlint
          else
            echo "warning: SwiftLint が未インストールです (brew install swiftlint)"
          fi
        basedOnDependencyAnalysis: false

  TaskManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TaskManagerUITests]
    dependencies:
      - target: TaskManager

schemes:
  TaskManager:
    build:
      targets:
        TaskManager: all
    run:
      config: Debug
      # Xcode の Edit Scheme でチェックを入れると、ホームの昼夜ゲージが 30 秒で 1 日分進む
      commandLineArguments:
        "-DaylightDemo": false
    test:
      config: Debug
      targets:
        - package: TaskManagerKit/DomainTests
        - package: TaskManagerKit/PersistenceTests
        - package: TaskManagerKit/TaskEditorFeatureTests
        - package: TaskManagerKit/TaskListFeatureTests
        - package: TaskManagerKit/HomeFeatureTests
        - package: TaskManagerKit/SettingsFeatureTests
        - package: TaskManagerKit/UsageTimeFeatureTests
        - TaskManagerUITests
